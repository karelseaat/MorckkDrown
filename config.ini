[mappings]
header1_alignment = "center"
frontmatter_alignment = "right"
ordered_list_prefix = "("
ordered_list_suffix = ")"
link_url_open = "⟮"
link_url_close = "⟯"
document_width = 40
header_style = "box" 
# Options: prefix (default), underline, box
# You can also configure per-header style:
header1_style = "box"
header2_style = "underline"
header3_style = "prefix"
header_underline_char = "="
header_box_vertical = "│"
header_box_horizontal = "─"
header_box_corner_tl = "┌"
header_box_corner_tr = "┐"
header_box_corner_bl = "└"
header_box_corner_br = "┘"
header1 = "$"
header2 = "@"
header3 = "&"
header4 = "%"
header5 = "^"
header6 = "="
list_dash = "•"
list_asterisk = "‣"
list_plus = "⁃"
blockquote = "»"
code_block = "|||"
hr_dash = "—"
hr_asterisk = "∗"
hr_underscore = "–"
bold = "«"
italic = "‹"
underscore = "≋"
inline_code = "│"
link_open = "⟦"
link_close = "⟧"
